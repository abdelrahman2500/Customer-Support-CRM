name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Real, working credentials matching the `postgres`/`redis` service
  # containers below (not the previous dummy placeholders) — see
  # docs/architecture/05-auth-and-security.md ("Secrets"). Still not real
  # production secrets: these only ever exist inside an ephemeral CI job.
  DATABASE_URL: "postgresql://crm:crm@localhost:5432/crm?schema=public"
  REDIS_URL: "redis://localhost:6379"
  NODE_ENV: "test"
  JWT_ACCESS_SECRET: "ci-only-access-secret-not-a-real-secret-32chars"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-a-real-secret-32chars"
  JWT_REFRESH_TTL_DAYS: "7"
  CORS_ORIGINS: "http://localhost:3000"
  SEED_ADMIN_EMAIL: "ci-admin@example.com"
  SEED_ADMIN_PASSWORD: "ci-only-admin-password-not-a-real-secret-32ch"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Same images as docker-compose.yml's local dev services (Story 02) —
    # GitHub Actions runs these as plain containers alongside the job with
    # the ports below mapped to localhost, independent of this repo's own
    # Docker/WSL2 environment.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @crm/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        # Root `pnpm test` (turbo run test) now excludes `@crm/e2e` — see
        # its script in the root package.json. `@crm/e2e`'s Playwright
        # browser suite needs apps/web/apps/portal already built and
        # Chromium installed (neither is true yet at this point in the
        # job), and turbo's default strict env mode strips ambient env
        # vars (DATABASE_URL/REDIS_URL/JWT_*) from tasks it runs unless
        # they're declared in turbo.json, which broke apps/api's Nest
        # bootstrap when Playwright tried to start it here. The
        # `browser-e2e` job below runs `pnpm --filter @crm/e2e test`
        # directly (bypassing turbo) with real prerequisites and env.
        run: pnpm test

      - name: Start MinIO
        # apps/api's e2e suite boots the real AppModule, which includes
        # S3StorageService (Story 66) — it needs a real S3-compatible
        # endpoint at S3_ENDPOINT (defaults to http://localhost:9000, see
        # apps/api/src/common/config/env.validation.ts) exactly like
        # docker-compose.yml's local dev `minio` service provides. GitHub
        # Actions' `services:` containers (postgres/redis above) can't take
        # a custom command, and minio/minio requires one (`server /data`),
        # so it's started as a plain step instead.
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:latest server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO to become ready... ($i/30)"
            sleep 1
          done
          echo "::error::MinIO did not become ready within 30 seconds"
          exit 1

      - name: Integration tests
        # Story 115 — `test:e2e:prepare` (`prisma migrate reset --force`)
        # applies every migration from scratch, including
        # `add_runtime_db_role_grants`, which provisions the restricted
        # `crm_app` role — it does not exist yet during any earlier step
        # in this job, so APP_DATABASE_URL is scoped to this step only
        # (not the workflow-level env) to actually exercise the real app
        # running under crm_app end to end, proving no legitimate
        # operation was accidentally under-granted.
        env:
          APP_DATABASE_URL: "postgresql://crm_app:crm_app_dev_password@localhost:5432/crm?schema=public"
        run: pnpm --filter @crm/api test:e2e

  browser-e2e:
    name: Browser E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    # Story 114 — docs/architecture/11-quality-and-operations.md's named
    # "small set of critical flows" (an agent resolves a ticket, a
    # customer submits one through the portal), driven through a real
    # Chromium browser against apps/api + apps/web + apps/portal all
    # actually running. Kept as its own job (not folded into
    # build-and-test's "Integration tests" step) since it boots three
    # long-running servers and installs a browser — a materially
    # different runtime shape/cost than the API-level e2e suite.
    #
    # NOTE: this job has not been verified by an actual GitHub Actions
    # run from the environment that authored it — see this story's
    # completion report. It mirrors build-and-test's proven
    # services/MinIO/migrate+seed pattern as closely as possible.
    env:
      # Overrides the workflow-level CORS_ORIGINS (which only allows
      # apps/web's own origin) so apps/portal's origin is allowed too —
      # both apps/web and apps/portal run against this same apps/api
      # instance in this job. Mirrors apps/e2e/playwright.config.ts's own
      # local-dev override, done here at the workflow-env level instead
      # since CI sets real env vars directly rather than loading a `.env`
      # file.
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3002"
      # Explicit rather than relying on apps/web's and apps/portal's own
      # `?? "http://localhost:3001/api/v1"` fallback. Both `next build`
      # steps below compile this into their browser bundles, so this job
      # exercises the same build-time mechanism a real deployment uses —
      # just pointed at the apps/api instance Playwright starts locally.
      # turbo.json declares NEXT_PUBLIC_API_URL in the `build` task's `env`,
      # which is what makes it visible through turbo's strict env mode.
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
      # Story 115 — by the time apps/api's dev server actually starts
      # (after this job's own "Run migrations" step below), the
      # restricted crm_app role already exists, so it's safe to set this
      # at job level: apps/api runs under crm_app for the whole browser
      # E2E suite too, exercising the exact restricted role Playwright
      # drives.
      APP_DATABASE_URL: "postgresql://crm_app:crm_app_dev_password@localhost:5432/crm?schema=public"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @crm/api prisma:generate

      - name: Run migrations
        run: pnpm --filter @crm/api exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @crm/api prisma:seed

      - name: Start MinIO
        # Same reasoning as build-and-test's own "Start MinIO" step above:
        # this job's pre-built apps/api (see "Build API" below) boots the
        # real AppModule too, which includes S3StorageService (Story 66) —
        # its `onModuleInit` eagerly calls MinIO (`ensureBucketExists`) at
        # bootstrap, unconditionally, before Playwright's webServer health
        # check ever gets a chance. Without a reachable S3_ENDPOINT (this
        # job set none, so it defaults to http://localhost:9000, see
        # apps/api/src/common/config/env.validation.ts), that call throws
        # an uncaught ECONNREFUSED and crashes the process immediately —
        # confirmed while diagnosing a real "Process from config.webServer
        # was not able to start. Exit code: 1" CI failure. This job never
        # had a MinIO service (unlike build-and-test), so it was masked
        # only by apps/api's previous, much slower `nest start --watch`
        # startup (see "Build API" below) always timing out first.
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:latest server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO to become ready... ($i/30)"
            sleep 1
          done
          echo "::error::MinIO did not become ready within 30 seconds"
          exit 1

      - name: Build API
        # apps/e2e's playwright.config.ts now starts apps/api via its
        # pre-built `start` script (`node dist/main.js`), not `dev`
        # (`nest start --watch`) — that live `tsc --watch` compile
        # (~48-50s on a plain dev machine, `deleteOutDir: true` forces a
        # full recompile every run) genuinely exceeded this job's
        # Playwright webServer timeout in a real CI run; the pre-built
        # path measured ~7s to `/health` instead. Same `@crm/shared`/
        # `@crm/ai` build-dependency reasoning as "Build web" below.
        run: pnpm exec turbo run build --filter=@crm/api

      - name: Build web
        # `pnpm --filter @crm/web build` runs only apps/web's own `build`
        # script — it does not know about turbo.json's `build` task
        # dependency (`dependsOn: ["^build"]`), so on this job's fresh
        # checkout (no prior turbo build/cache from build-and-test — a
        # separate runner) `@crm/shared` was never compiled to
        # `packages/shared/dist`. `next build`'s SWC compile step still
        # "succeeds" because apps/web only ever imports `@crm/shared` via
        # `import type` (erased before bundling, so it needs no resolvable
        # module), but Next's separate `tsc`-based type-check pass then
        # fails with "Cannot find module '@crm/shared'". Going through
        # turbo (`--filter=@crm/web` still scopes the run to just this
        # package) restores turbo's own `^build` dependency graph, so
        # `@crm/shared#build` (cached or not) runs first.
        run: pnpm exec turbo run build --filter=@crm/web

      - name: Build portal
        # Same reasoning as "Build web" above — apps/portal also depends
        # on @crm/shared.
        run: pnpm exec turbo run build --filter=@crm/portal

      - name: Install Playwright browsers
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Browser E2E tests
        run: pnpm --filter @crm/e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  docker-images:
    name: Build Docker images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, portal, api, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: crm-${{ matrix.app }}:ci
          load: true
          # NEXT_PUBLIC_API_URL is compiled into the browser bundle by
          # `next build`, so apps/web and apps/portal cannot be built
          # without it — both Dockerfiles fail fast when it is empty, and
          # then assert the localhost development fallback is absent from
          # the output (scripts/assert-public-api-url.mjs). See
          # docs/deployment.md.
          #
          # `vars.NEXT_PUBLIC_API_URL` is an optional repository variable:
          # set it and CI builds images carrying the real deployed API URL;
          # leave it unset and the placeholder below keeps this job a
          # genuine test of the build-arg wiring (it is not a real
          # hostname, and these images are never pushed anywhere). The
          # api/worker Dockerfiles ignore the arg.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.ci.invalid/api/v1' }}

      # A second, independent check — this one against the *built runtime
      # image* rather than against the build stage, proving that what
      # actually shipped in the final layer points at the configured API
      # URL. The Dockerfile's own assertion runs in the `build` stage; this
      # one inspects the `.next` output as the container really carries it.
      # The script is bind-mounted rather than baked into the image, so the
      # runtime image stays free of build tooling.
      #
      # No registry push / deploy step: no container registry has been
      # chosen for this project, so pushing would mean inventing deployment
      # infrastructure. docs/deployment.md ("Supplied by the deployment
      # platform") lists exactly what enabling it would require.
      #
      # NOTE: `load: true` above plus this step have not been exercised by
      # an actual GitHub Actions run from the environment that authored
      # them — same disclosure as the browser-e2e job's own note. Both
      # commands were verified locally against the real images
      # (`docker build -f apps/web/Dockerfile --build-arg
      # NEXT_PUBLIC_API_URL=... .` followed by this exact `docker run`).
      - name: Assert ${{ matrix.app }} image has no localhost API fallback
        if: matrix.app == 'web' || matrix.app == 'portal'
        env:
          EXPECTED_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.ci.invalid/api/v1' }}
        run: >-
          docker run --rm --entrypoint node
          -v "$PWD/scripts:/scripts:ro"
          -w /repo
          crm-${{ matrix.app }}:ci
          /scripts/assert-public-api-url.mjs
          apps/${{ matrix.app }} "$EXPECTED_API_URL"
