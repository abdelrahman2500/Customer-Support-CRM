name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Real, working credentials matching the `postgres`/`redis` service
  # containers below (not the previous dummy placeholders) — see
  # docs/architecture/05-auth-and-security.md ("Secrets"). Still not real
  # production secrets: these only ever exist inside an ephemeral CI job.
  DATABASE_URL: "postgresql://crm:crm@localhost:5432/crm?schema=public"
  REDIS_URL: "redis://localhost:6379"
  NODE_ENV: "test"
  JWT_ACCESS_SECRET: "ci-only-access-secret-not-a-real-secret-32chars"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-a-real-secret-32chars"
  JWT_REFRESH_TTL_DAYS: "7"
  CORS_ORIGINS: "http://localhost:3000"
  SEED_ADMIN_EMAIL: "ci-admin@example.com"
  SEED_ADMIN_PASSWORD: "ci-only-admin-password-not-a-real-secret-32ch"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Same images as docker-compose.yml's local dev services (Story 02) —
    # GitHub Actions runs these as plain containers alongside the job with
    # the ports below mapped to localhost, independent of this repo's own
    # Docker/WSL2 environment.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @crm/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm --filter @crm/api test:e2e

  docker-images:
    name: Build Docker images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, portal, api, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: crm-${{ matrix.app }}:ci
          # No registry push / deploy step — production deployment is
          # explicitly out of scope for this feature, see
          # docs/architecture/12-risks-tradeoffs-and-scope.md.
